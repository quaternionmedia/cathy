# A made-up site's configuration, read by the tests and the walkthrough.
# Every path here is relative to this file.

[source]
format = "squarespace-wxr"
export = "export.xml"
include_drafts = false

[output]
docs = "docs"
assets = "docs/assets"
manifest = "image_urls.tsv"

[images]
# Images on these hosts are listed for `cathy fetch` and linked locally;
# an image on any other host stays a link to that host.
hosts = ["images.squarespace-cdn.com"]

[pages]
about = "about.md"

# Each [[posts]] is one collection: the posts whose link starts with its
# link_prefix, written to its dir. A site with one collection may write it as
# a single [posts] table. Two prefixes may not overlap, and two dirs may not be
# one directory. A [posts.slugs] or [posts.tags] table belongs to the [[posts]]
# above it.

[[posts]]
link_prefix = "/projects/"
dir = "projects"

[posts.slugs]
x9k2q7w4m1zp8v3d6b0n5c = "night-market"

[posts.tags]
brass-and-bellows = ["music"]
night-market = ["music", "tech"]

[[posts]]
link_prefix = "/calendar/"
dir = "calendar"

[posts.tags]
spring-concert = ["concert"]
